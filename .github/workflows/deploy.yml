name: Deploy MailCraft

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: ./mailcraft
          file: ./mailcraft/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mailcraft:latest
            ghcr.io/${{ github.repository_owner }}/mailcraft:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mailcraft:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mailcraft:cache,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v5
        with:
          context: ./mailcraft
          file: ./mailcraft/Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mailcraft:migrate
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mailcraft:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mailcraft:cache,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            # Any failure (backup, pull, migration) stops the deploy — the running app is left untouched
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io -u jayrdoria --password-stdin
            cd /home/admin/web/employee.netovation.eu/public_html/mailcraft/mailcraft

            # DB backup before every deploy — written to .tmp first so a failed dump never looks like a good one.
            # Keeps the newest 2. Restore: pg_restore into the postgres container (needs SSH).
            BACKUP_DIR=/home/admin/mailcraft-backups
            BACKUP_FILE="$BACKUP_DIR/pre-deploy-$(date +%Y%m%d-%H%M%S).dump"
            mkdir -p "$BACKUP_DIR"
            docker compose -f docker-compose.prod.yml exec -T postgres \
              sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP_FILE.tmp"
            mv "$BACKUP_FILE.tmp" "$BACKUP_FILE"
            ls -1t "$BACKUP_DIR"/pre-deploy-*.dump | tail -n +3 | xargs -r rm --
            echo "DB backup saved: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"

            git pull

            docker pull ghcr.io/jayrdoria/mailcraft:latest
            docker pull ghcr.io/jayrdoria/mailcraft:migrate

            docker run --rm \
              --network mailcraft_default \
              --env-file .env \
              ghcr.io/jayrdoria/mailcraft:migrate

            docker compose -f docker-compose.prod.yml up -d --no-deps app

            # Register new master templates (create-only — skips if already present).
            # Runs after the app restart so the running Prisma client knows the new enum values.
            docker run --rm \
              --network mailcraft_default \
              --env-file .env \
              -e REDIS_URL=redis://redis:6379 \
              ghcr.io/jayrdoria/mailcraft:migrate \
              npx tsx prisma/seed-x7v2.ts \
              || echo "WARNING: X7 Casino V2 registration failed — app is deployed; check the log above"

            docker image prune -f

            echo "MailCraft deployed at employee.netovation.eu/mailcraft"
